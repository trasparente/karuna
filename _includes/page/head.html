<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="{{ color_scheme }}" />
  <meta name="generator" content="Jekyll v{{ site.github.versions.jekyll }}" />
  <title>{{ site.title }}</title>
  <!-- META -->
  <meta name="color-scheme" content="light" />
  <meta name="description" content="{{ site.github.project_tagline }}">
  <meta property="og:title" content="Cosmonauti surf band">
  <meta property="og:image" content="{{ page.image }}">
  <meta property="og:description" content="{{ site.github.project_tagline }}">
  <!-- FAVICON.ICO -->
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon/favicon.ico"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/assets/images/favicon/site.webmanifest">
  <!-- LINKS -->
  <link rel='canonical' href='{{ page.url | absolute_url }}' />
  <!-- CSS -->
  <link rel='stylesheet' href='{{ "assets/css/stylesheet.css" | absolute_url }}?version={{ site.github.build_revision | slice: 0, 7 }}'>
  <!-- JS -->
  <!-- jQuery 3.6.3 https://api.jquery.com/ -->
  <script src='{{ "assets/scripts/jquery-3.6.3.min.js" | absolute_url }}'></script>
  <!-- Custom script Deferred -->
  <script src='{{ "assets/scripts/script.js" | absolute_url }}?version={{ site.github.build_revision | slice: 0, 7 }}' defer></script>  
</head>
